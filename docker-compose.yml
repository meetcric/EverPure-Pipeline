# Fixed project name so container/volume names don't depend on the folder name.
name: pipeline-pulse

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password # local dev only; no secrets in this stack
      POSTGRES_DB: pulse
    volumes:
      - pgdata:/var/lib/postgresql/data # named volume -> data survives restarts and `down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pulse"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: ./backend
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://user:password@db:5432/pulse?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://user:password@db:5432/pulse?sslmode=disable # "db" = service name
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy # wait until Postgres accepts connections, not just "started"
      migrate:
        condition: service_completed_successfully # fail fast: no api on a broken schema
    restart: unless-stopped

volumes:
  pgdata:
