server {
    listen 3000;
    root /usr/share/nginx/html;

    # Docker's internal DNS. Putting the upstream in a variable makes nginx look "api" up
    # per request: it starts even if the API isn't up yet, and follows a recreated container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    # The browser calls /api on this origin and nginx forwards it, so no CORS is needed.
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # SSE: pass each event through as soon as it arrives, and keep long-lived streams open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Build files have a content hash in their name, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /pipelines/x and /runs/y aren't files: serve index.html and let React Router handle them.
    location / {
        try_files $uri /index.html;
    }
}
